<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -14 432 240" width="864" height="480" role="img" aria-labelledby="idl-sg-dt">
  <rect x="-16" y="-14" width="432" height="240" fill="#1A1F18"/>
        <title id="idl-sg-dt">Technical flat drawings of the IDL short sleeve and long sleeve jerseys side by side, drawn to true scale from the size M measurements, with the five measurement points marked A to E. The short sleeve is almost as wide as it is long; the long sleeve is markedly narrower.</title>
        <g fill="none" stroke="#F4F0E6" stroke-width="2.5" stroke-linejoin="round">
          <path d="M82,34 L57,40 L22,61 L40,93 L47,84 L47,144 L153,144 L153,84 L160,93 L178,61 L143,40 L118,34 C112,48 88,48 82,34 Z"/>
          <path d="M283,34 L261,40 L213,123 L230,133 L259,78 L259,144 L341,144 L341,78 L370,133 L387,123 L339,40 L317,34 C312,47 288,47 283,34 Z"/>
        </g>
        <!-- dimension marks: A/B/C on the short sleeve, D/E on the long sleeve (same points on both) -->
        <g stroke="#C8E614" stroke-width="1.5" stroke-dasharray="4 3">
          <path d="M100,42 L100,142"/>
          <path d="M32,94 L151,94"/>
          <path d="M57,20 L143,20"/>
          <path d="M260,59 L221,128"/>
          <path d="M214,125 L229,134"/>
        </g>
        <g stroke="#C8E614" stroke-width="1.5">
          <path d="M57,15 L57,40 M143,15 L143,40"/>
        </g>
        <g fill="#C8E614">
          <rect x="89" y="100" width="22" height="22"/>
          <rect x="6" y="83" width="22" height="22"/>
          <rect x="151" y="9" width="22" height="22"/>
          <rect x="210" y="70" width="22" height="22"/>
          <rect x="196" y="142" width="22" height="22"/>
        </g>
        <g fill="#0A0A0C" font-size="13" font-weight="700" text-anchor="middle"
           font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
          <text x="100" y="116">A</text>
          <text x="17" y="99">B</text>
          <text x="162" y="25">C</text>
          <text x="221" y="86">D</text>
          <text x="207" y="158">E</text>
        </g>
        <g text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
          <g fill="#8A9080" font-size="11" letter-spacing="1.6">
            <text x="100" y="180">SHORT SLEEVE</text>
            <text x="300" y="180">LONG SLEEVE</text>
          </g>
          <g fill="#C8E614" font-size="11" font-weight="700" letter-spacing="1.6">
            <text x="100" y="194">OVERSIZED</text>
            <text x="300" y="194">ATHLETIC</text>
          </g>
        </g>
      </svg>
